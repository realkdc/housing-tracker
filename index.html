<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housing</title>
<style>
:root{
  --bg:#0b0e13; --surface:#141920; --surface2:#1a212b; --surface3:#212a36;
  --line:#27303d; --line-soft:#1f2733;
  --text:#e8eef5; --muted:#8a95a3; --muted2:#5f6a77;
  --accent:#5b9dff; --accent-dim:rgba(91,157,255,.14);
  --ok:#3ecf6e; --ok-dim:rgba(62,207,110,.13);
  --warn:#e0a83c; --warn-dim:rgba(224,168,60,.13);
  --bad:#f4675c; --bad-dim:rgba(244,103,92,.13);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;}

.wrap{max-width:1220px;margin:0 auto;padding:16px 14px 44px;}

/* ---------- HEADER ---------- */
.hd{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.hd h1{font-size:1.3rem;margin:0 0 3px;letter-spacing:-.5px;font-weight:800;}
.hd .sub{color:var(--muted);font-size:.72rem;line-height:1.6;max-width:700px;}
.hd .sub b{color:var(--text);font-weight:600;}
.hd-r{margin-left:auto;text-align:right;}
.big{font-size:1.9rem;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--ok);}
.big-l{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
  font-weight:800;margin-top:3px;}

/* ---------- FILTER BAR ---------- */
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:9px 11px;margin-bottom:13px;}
.qwrap{position:relative;flex:1;min-width:150px;max-width:250px;}
.q{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:7px 11px 7px 30px;border-radius:8px;font-size:.75rem;}
.q::placeholder{color:var(--muted2);}
.q:focus{outline:none;border-color:var(--accent);}
.qic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:.8rem;}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;flex-shrink:0;}
.seg button{background:transparent;border:none;color:var(--muted);padding:7px 11px;
  font-size:.7rem;font-weight:700;cursor:pointer;transition:.13s;white-space:nowrap;}
.seg button+button{border-left:1px solid var(--line);}
.seg button:hover{color:var(--text);}
.seg button.on{background:var(--accent);color:#08111f;}
.sortsel{background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:7px 9px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;}
.spacer{flex:1;}

/* ---------- GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px;}

.c{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;}
.c:hover{transform:translateY(-3px);border-color:var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.5);}
.c.hid{display:none;}
.c.pick{border-color:rgba(62,207,110,.45);}

/* photo */
.ph{position:relative;aspect-ratio:4/3;background:var(--surface2);overflow:hidden;flex-shrink:0;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s;}
.c:hover .ph img{transform:scale(1.05);}
.np{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--muted2);font-size:.66rem;font-weight:700;letter-spacing:.5px;}

/* grade chip on photo */
.gr{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;
  backdrop-filter:blur(8px);border:1px solid;}
.gA{background:rgba(62,207,110,.9);color:#04140a;border-color:rgba(62,207,110,.95);}
.gB{background:rgba(91,157,255,.9);color:#041020;border-color:rgba(91,157,255,.95);}
.gC{background:rgba(224,168,60,.92);color:#150e01;border-color:rgba(224,168,60,.95);}
.gD{background:rgba(244,103,92,.9);color:#1a0505;border-color:rgba(244,103,92,.95);}
.gN{background:rgba(90,100,112,.85);color:#0b0e13;border-color:rgba(90,100,112,.9);}
.pc{position:absolute;left:8px;bottom:8px;background:rgba(7,10,15,.85);backdrop-filter:blur(8px);
  padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.1);}
.pc .amt{font-size:.95rem;font-weight:800;letter-spacing:-.4px;line-height:1.15;}
.pc .tag{font-size:.53rem;font-weight:800;letter-spacing:.5px;color:var(--ok);}
.pc.over .tag{color:var(--bad);}
.pc.over{border-color:rgba(244,103,92,.4);}

/* body */
.b{padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px;flex:1;}
.t{font-size:.85rem;font-weight:800;letter-spacing:-.25px;line-height:1.3;}
.m{color:var(--muted);font-size:.65rem;line-height:1.5;}

/* amenity strip */
.am{display:flex;gap:4px;}
.ami{flex:1;background:var(--surface2);border:1px solid var(--line-soft);border-radius:7px;
  padding:5px 3px;text-align:center;line-height:1.25;}
.ami .ic{font-size:.68rem;font-weight:900;display:block;}
.ami .lb{font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.35px;
  font-weight:800;margin-top:1px;}
.ami.y{background:var(--ok-dim);border-color:rgba(62,207,110,.3);}
.ami.y .ic{color:var(--ok);}
.ami.mid{background:var(--warn-dim);border-color:rgba(224,168,60,.3);}
.ami.mid .ic{color:var(--warn);}
.ami.n{background:var(--bad-dim);border-color:rgba(244,103,92,.3);}
.ami.n .ic{color:var(--bad);}
.ami.u .ic{color:var(--muted2);}

/* verdict line */
.vl{font-size:.66rem;font-weight:700;line-height:1.45;border-radius:7px;padding:5px 8px;}
.vl.pass{background:var(--ok-dim);color:#8ce6a8;}
.vl.gap{background:var(--warn-dim);color:#ecc878;}
.vl.hard{background:var(--bad-dim);color:#f5a49c;}

/* footer row */
.f{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:7px;
  border-top:1px solid var(--line-soft);}
.ab{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  padding:3px 7px;border-radius:5px;}
.ab-ok{background:rgba(62,207,110,.9);color:#04140a;}
.ab-no{background:rgba(244,103,92,.9);color:#1a0505;}
.ab-unk{background:var(--surface3);color:var(--muted);}
.f .ct{margin-left:auto;font-size:.62rem;color:var(--muted2);font-weight:700;}

/* ---------- ARCHIVED ---------- */
.arch{margin-top:22px;border-top:1px solid var(--line-soft);padding-top:14px;}
.arch-h{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.arch-h h2{font-size:.8rem;margin:0;color:var(--muted);font-weight:800;}
.arch-h .n{background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:999px;}
.arch-h .tw{margin-left:auto;color:var(--muted2);font-size:.7rem;transition:transform .2s;}
.arch.open .arch-h .tw{transform:rotate(180deg);}
.arch-b{display:none;margin-top:11px;}
.arch.open .arch-b{display:block;}

/* ---------- MODAL ---------- */
.mo{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);
  z-index:90;display:none;align-items:flex-end;justify-content:center;}
.mo.on{display:flex;}
.sh{background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  position:relative;animation:up .26s cubic-bezier(.2,.8,.3,1);}
@keyframes up{from{transform:translateY(28px);opacity:0;}to{transform:none;opacity:1;}}
.sh-ph{position:relative;aspect-ratio:16/9;background:var(--surface2);cursor:zoom-in;}
.sh-ph img{width:100%;height:100%;object-fit:cover;}
.sh-x{position:absolute;top:11px;right:11px;width:32px;height:32px;border-radius:50%;
  background:rgba(7,10,15,.8);border:1px solid var(--line);color:var(--text);
  font-size:1.05rem;cursor:pointer;z-index:3;backdrop-filter:blur(8px);}
.sh-x:hover{border-color:var(--accent);}
.sh-g{position:absolute;left:13px;bottom:13px;width:44px;height:44px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);}
.sh-g .n{font-size:1.2rem;line-height:1;}
.sh-g .c{font-size:.5rem;letter-spacing:.4px;font-weight:800;opacity:.85;}
.sh-b{padding:14px 16px 22px;}
.sh-t{font-size:1.12rem;font-weight:800;letter-spacing:-.4px;line-height:1.25;}
.sh-s{color:var(--muted);font-size:.72rem;margin:3px 0 12px;line-height:1.6;}
.sh-sec{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
  font-weight:800;margin:15px 0 7px;}
.sh-am{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.sh-amr{display:flex;justify-content:space-between;gap:9px;background:var(--surface2);
  border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;font-size:.72rem;}
.sh-amr .k{color:var(--muted);}
.sh-amr .v{font-weight:800;text-align:right;}
.sh-vd{font-size:.74rem;line-height:1.6;border-radius:9px;padding:9px 11px;border:1px solid;
  font-weight:600;}
.sh-acts{display:flex;gap:8px;margin-top:16px;}
.b1{flex:1;text-align:center;background:var(--accent);color:#08111f;padding:10px;
  border-radius:9px;font-size:.78rem;font-weight:800;border:none;cursor:pointer;}
.b1:hover{filter:brightness(1.08);}
.b2{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  padding:10px 15px;border-radius:9px;font-size:.78rem;font-weight:800;cursor:pointer;}
.b2:hover{color:var(--text);border-color:var(--accent);}
.sh-src{margin-top:12px;background:var(--surface2);border:1px solid var(--line-soft);
  border-radius:8px;padding:9px 11px;font-size:.66rem;color:var(--muted);line-height:1.65;}

.none{display:none;text-align:center;padding:48px 20px;color:var(--muted);}
.none.on{display:block;}
.none .ic{font-size:1.9rem;margin-bottom:7px;}

.lb{display:none;position:fixed;inset:0;background:rgba(3,5,8,.96);z-index:95;
  align-items:center;justify-content:center;cursor:zoom-out;}
.lb.on{display:flex;}
.lb img{max-width:93%;max-height:90%;border-radius:9px;}

@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:9px;}
  .hd h1{font-size:1.1rem;}
  .big{font-size:1.6rem;}
  .bar{padding:8px;}
  .qwrap{max-width:none;min-width:120px;}
}
@media(max-width:400px){.grid{grid-template-columns:1fr;}}
</style>
</head>

/* ==================== HELPERS ==================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pnum(p){var m=String(p).match(/([\d,]+)/);return m?parseInt(m[1].replace(/,/g,''),10):999999;}
function inB(p){return pnum(p)<=800;}
function grade(n){
  if(n==null) return {g:'?',c:'gN',t:'Not measured'};
  if(n<=20)  return {g:'A',c:'gA',t:n+' calls / 0.25mi / 90d'};
  if(n<=50)  return {g:'B',c:'gB',t:n+' calls / 0.25mi / 90d'};
  if(n<=120) return {g:'C',c:'gC',t:n+' calls / 0.25mi / 90d'};
  return {g:'D',c:'gD',t:n+' calls / 0.25mi / 90d'};
}
function wdS(o){
  if(o.wd==='inunit')  return ['In-unit','y','Washer and dryer inside the unit'];
  if(o.wd==='onsite')  return ['On-site','mid','Shared laundry room in the building'];
  if(o.wd==='shared')  return ['Shared','n','Laundry is shared, not in the unit'];
  return ['?','u','Could not verify from any public page'];
}
function pkS(o){
  if(o.park==='garage')    return ['Garage','y','Garage included'];
  if(o.park==='offstreet') return ['Off-street','y','Off-street parking'];
  if(o.park==='parking')   return ['Parking','mid','Some parking, type unclear'];
  return ['?','u','Could not verify'];
}
function dwS(o){
  return o.dw==='yes' ? ['Dish','y','Dishwasher in unit'] : ['?','u','Could not verify'];
}
function avS(o){
  var a=(o.avail||'').toLowerCase();
  if(a.indexOf('unavailable')>=0||a.indexOf('not listed')>=0) return ['Unavailable','ab-no','no'];
  if(a.indexOf('available now')>=0||a.indexOf('listed')>=0)   return ['Available','ab-ok','ok'];
  return ['Unverified','ab-unk','unk'];
}
function core(o){ return o.wd==='inunit' && (o.park==='garage'||o.park==='offstreet'); }

function verdict(o){
  var f=[],hard=false;
  if(pnum(o.price)>800) f.push('$'+pnum(o.price)+' over ceiling');
  if(o.beds!=null&&o.beds<2){f.push('only '+o.beds+'BR');hard=true;}
  if(o.zip==='57104'){f.push('zip 57104 excluded');hard=true;}
  if(o.wd!=='inunit'){
    if(o.wd==='onsite'){f.push('no in-unit W/D');hard=true;}
    else if(o.wd==='shared'){f.push('no in-unit W/D');hard=true;}
    else f.push('W/D unverified');
  }
  if(o.park==='unknown') f.push('parking unverified');
  else if(o.park==='parking') f.push('parking unclear');
  var g=grade(o.sfpd);
  if(o.sfpd!=null&&(g.g==='C'||g.g==='D')) f.push('SFPD '+g.g+' ('+o.sfpd+')');
  if(avS(o)[2]==='no'){f.push('no longer available');hard=true;}
  if(!f.length) return {cls:'pass',txt:'Meets every target'};
  return {cls:hard?'hard':'gap',txt:(hard?'Blocked: ':'Gaps: ')+f.join(' \u00b7 ')};
}

/* ==================== CARD ==================== */
function cardHTML(o,compact){
  var g=grade(o.sfpd),av=avS(o),wd=wdS(o),pk=pkS(o),dw=dwS(o),v=verdict(o);
  var over=!inB(o.price);
  var photo=o.photo
    ? '<img src="'+esc(o.photo)+'" alt="'+esc(o.name)+'" loading="lazy">'
    : '<div class="np">NO PHOTO</div>';
  return '<div class="c'+(core(o)?' pick':'')+'" data-slug="'+esc(o.slug)+
    '" data-core="'+(core(o)?1:0)+'" data-avail="'+av[2]+
    '" data-safe="'+((g.g==='A'||g.g==='B')?1:0)+'" data-budget="'+(inB(o.price)?1:0)+
    '" data-price="'+pnum(o.price)+'" data-calls="'+(o.sfpd==null?99999:o.sfpd)+
    '" data-gr="'+g.g+'" data-name="'+esc((o.name+' '+(o.zip||'')+' '+(o.address||'')).toLowerCase())+'">'+
    '<div class="ph">'+photo+
      '<div class="gr '+g.c+'" title="'+esc(g.t)+'">'+g.g+'</div>'+
      '<div class="pc'+(over?' over':'')+'"><div class="amt">'+esc(o.price_raw)+
        '</div><div class="tag">'+(over?'OVER':'IN BUDGET')+'</div></div>'+
    '</div>'+
    '<div class="b">'+
      '<div><div class="t">'+esc(o.name)+'</div>'+
      '<div class="m">'+esc(o.type||'')+(o.type?' &middot; ':'')+esc(o.manager||'')+
        (o.zip?'<br>'+esc(o.zip):'')+'</div></div>'+
      '<div class="am">'+
        '<div class="ami '+wd[1]+'" title="'+esc(wd[2])+'"><span class="ic">'+
          (wd[1]==='y'?'&#10003;':wd[1]==='n'?'&#10007;':wd[1]==='mid'?'&#9650;':'?')+
          '</span><span class="lb">'+esc(wd[0])+'</span></div>'+
        '<div class="ami '+pk[1]+'" title="'+esc(pk[2])+'"><span class="ic">'+
          (pk[1]==='y'?'&#10003;':pk[1]==='n'?'&#10007;':pk[1]==='mid'?'&#9650;':'?')+
          '</span><span class="lb">'+esc(pk[0])+'</span></div>'+
        '<div class="ami '+dw[1]+'" title="'+esc(dw[2])+'"><span class="ic">'+
          (dw[1]==='y'?'&#10003;':dw[1]==='n'?'&#10007;':'?')+
          '</span><span class="lb">Dish</span></div>'+
      '</div>'+
      '<div class="vl '+v.cls+'">'+esc(v.txt)+'</div>'+
      '<div class="f"><span class="ab '+av[1]+'">'+esc(av[0])+'</span>'+
        (o.sfpd!=null?'<span class="ct">'+o.sfpd+' calls</span>':'')+'</div>'+
    '</div></div>';
}

/* ==================== MODAL ==================== */
function openModal(slug){
  var o=L.filter(function(x){return x.slug===slug;})[0];
  if(!o)return;
  var g=grade(o.sfpd),av=avS(o),wd=wdS(o),pk=pkS(o),dw=dwS(o),v=verdict(o);
  var am='';
  function r(k,val,dim){return '<div class="sh-amr"><span class="k">'+k+'</span>'+
    '<span class="v" style="'+(dim?'color:var(--muted);font-weight:600':'')+'">'+esc(val)+'</span></div>';}
  am+=r('Washer/dryer',wd[0]+' \u2014 '+wd[2],wd[1]==='u');
  am+=r('Parking',pk[0]+' \u2014 '+pk[2],pk[1]==='u');
  am+=r('Dishwasher',dw[0]+' \u2014 '+dw[2],dw[1]==='u');
  if(o.beds!=null) am+=r('Layout',o.beds+'BR / '+o.baths+'BA');
  if(o.sqft) am+=r('Size',o.sqft+' sq ft');
  if(o.zip) am+=r('Zip',o.zip);
  am+=r('Rent',o.price_raw);
  if(o.deposit) am+=r('Deposit',o.deposit,/tbd|unknown/i.test(o.deposit));
  if(o.lease) am+=r('Lease',o.lease,/tbd|unknown/i.test(o.lease));
  if(o.utils) am+=r('Utilities incl.',o.utils);
  am+=r('Availability',o.avail||'?');
  am+=r('Safety',g.g+' ('+(o.sfpd==null?'not measured':o.sfpd+' calls in 0.25mi / 90d')+')');
  if(o.address) am+=r('Address',o.address);
  if(o.phone) am+=r('Phone',o.phone);
  if(o.manager) am+=r('Manager',o.manager);
  document.getElementById('sh').innerHTML=
    (o.photo?'<div class="sh-ph" onclick="zoom(this.querySelector(\'img\').src)">'+
      '<img src="'+esc(o.photo)+'" alt=""><div class="sh-g '+g.c+'">'+
      '<span class="n">'+g.g+'</span><span class="c">'+(o.sfpd==null?'N/A':o.sfpd)+'</span></div>'+
      '<button class="sh-x" onclick="event.stopPropagation();closeModal()">&times;</button></div>'
      :'<button class="sh-x" onclick="closeModal()">&times;</button>')+
    '<div class="sh-b">'+
      '<div class="sh-t">'+esc(o.name)+'</div>'+
      '<div class="sh-s">'+esc(o.type||'')+(o.type?' &middot; ':'')+esc(o.manager||'')+
        (o.zip?' &middot; '+esc(o.zip):'')+' &middot; <b>'+esc(o.price_raw)+'</b></div>'+
      '<div class="sh-vd vl '+v.cls+'" style="font-size:.75rem;padding:9px 11px;">'+esc(v.txt)+'</div>'+
      '<div class="sh-sec">Details</div>'+
      '<div class="sh-am">'+am+'</div>'+
      (o.amenity_source?'<div class="sh-sec">Where these facts came from</div>'+
        '<div class="sh-src">'+esc(o.amenity_source)+'</div>':'')+
      '<div class="sh-acts">'+
        '<a class="b1" href="'+esc(o.url)+'" target="_blank" rel="noopener">Open listing &#8599;</a>'+
        '<button class="b2" onclick="closeModal()">Close</button>'+
      '</div>'+
    '</div>';
  document.getElementById('mo').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('mo').classList.remove('on');
  document.body.style.overflow='';
}
function zoom(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('on');}

/* ==================== RENDER ==================== */
var FILTER='all',QUERY='',SORT='fit';
function bucket(o){ return avS(o)[2]; }
function pass(o){
  var g=grade(o.sfpd).g;
  if(FILTER==='core')   return core(o);
  if(FILTER==='safe')   return g==='A'||g==='B';
  if(FILTER==='budget') return inB(o.price);
  return true;
}
function render(){
  var live=L.filter(function(o){return bucket(o)==='ok';});
  var gone=L.filter(function(o){return bucket(o)==='no';});
  var unv =L.filter(function(o){return bucket(o)==='unk';});
  var shown=live.filter(pass).filter(function(o){
    return !QUERY||(o.name+' '+(o.zip||'')+' '+(o.address||'')).toLowerCase().indexOf(QUERY)>=0;});
  document.getElementById('grid').innerHTML=shown.map(function(o){return cardHTML(o);}).join('');
  document.getElementById('none').classList.toggle('on',shown.length===0);
  document.getElementById('hN').textContent=shown.length;
  document.getElementById('archG').innerHTML=gone.map(function(o){return cardHTML(o);}).join('');
  document.getElementById('unvG').innerHTML =unv.map(function(o){return cardHTML(o);}).join('');
  document.getElementById('archN').textContent=gone.length;
  document.getElementById('unvN').textContent=unv.length;
  document.getElementById('arch').style.display=gone.length?'':'none';
  document.getElementById('unv').style.display=unv.length?'':'none';
  sortDom(document.getElementById('grid'));
  attach();
}
function sortDom(root){
  var cards=Array.prototype.slice.call(root.querySelectorAll('.c'));
  var gord={A:0,B:1,C:2,D:3,'?':4};
  cards.sort(function(a,b){
    if(SORT==='price') return (+a.dataset.price)-(+b.dataset.price);
    if(SORT==='calls') return (+b.dataset.calls)-(+a.dataset.calls);
    if(SORT==='safe'){var d=gord[a.dataset.gr]-gord[b.dataset.gr];
      if(d)return d; return (+a.dataset.calls)-(+b.dataset.calls);}
    var sc=function(c){var s=0;
      if(c.dataset.core==='1')s+=100; if(c.dataset.safe==='1')s+=30;
      if(c.dataset.budget==='1')s+=20; return s;};
    var d=sc(b)-sc(a); if(d)return d;
    return (+a.dataset.price)-(+b.dataset.price);
  });
  cards.forEach(function(c){root.appendChild(c);});
}
function attach(){
  document.querySelectorAll('.c').forEach(function(c){
    c.onclick=function(e){
      if(e.target.closest('a'))return;
      openModal(c.dataset.slug);
    };
  });
}

/* ==================== INIT ==================== */
render();
document.getElementById('q').addEventListener('input',function(e){
  QUERY=e.target.value.toLowerCase().trim(); render();});
document.querySelectorAll('#seg button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#seg button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); FILTER=b.dataset.f; render();
  });
});
document.getElementById('sort').addEventListener('change',function(e){SORT=e.target.value;render();});
document.getElementById('archH').addEventListener('click',function(){
  document.getElementById('arch').classList.toggle('open');});
document.getElementById('unvH').addEventListener('click',function(){
  document.getElementById('unv').classList.toggle('open');});
document.getElementById('mo').addEventListener('click',function(e){
  if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();document.getElementById('lb').classList.remove('on');}
});
</script>
