<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Housing Deck</title>
<style>
:root{
  --bg:#0a0d12; --card:#161b22; --elev:#1c2230; --line:#262d38;
  --text:#e6edf3; --muted:#8b949e; --muted2:#6a737d;
  --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --like:#3fb950; --nope:#f85149;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column;
}

/* ---------- TOP BAR ---------- */
.top{
  padding:14px 16px 10px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line); background:var(--bg); z-index:20; flex-shrink:0;
}
.brand{font-size:1.05rem; font-weight:800; letter-spacing:-.4px;}
.brand span{color:var(--accent);}
.count{font-size:.72rem;color:var(--muted);margin-left:auto;font-weight:600;}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;flex-shrink:0;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fchip{
  background:var(--elev);border:1px solid var(--line);color:var(--muted);
  padding:5px 12px;border-radius:999px;font-size:.7rem;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .13s;flex-shrink:0;
}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#08111f;}

/* ---------- DECK ---------- */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:0;padding:8px 14px 4px;overflow:hidden;}
.deck{position:relative;width:100%;max-width:400px;height:100%;max-height:600px;}

.card{
  position:absolute; inset:0; background:var(--card);
  border-radius:20px; overflow:hidden; border:1px solid var(--line);
  box-shadow:0 14px 40px rgba(0,0,0,.55);
  display:flex; flex-direction:column;
  will-change:transform; touch-action:none;
  transition:transform .34s cubic-bezier(.2,.8,.3,1), opacity .3s;
}
.card.dragging{transition:none;}
.card.gone{opacity:0;pointer-events:none;}

/* photo */
.ph{position:relative;height:52%;background:#0d1117;flex-shrink:0;overflow:hidden;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph .np{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--muted2);font-size:.72rem;font-weight:700;letter-spacing:.5px;}

/* overlays */
.ov{position:absolute;font-weight:800;border-radius:10px;backdrop-filter:blur(8px);}
.o-price{left:12px;bottom:12px;background:rgba(6,9,14,.85);padding:6px 12px;font-size:1.15rem;
  letter-spacing:-.4px;border:1px solid rgba(255,255,255,.12);}
.o-price small{display:block;font-size:.56rem;color:var(--muted);letter-spacing:.5px;font-weight:700;}
.o-price.over{border-color:rgba(248,81,73,.6);}
.o-price.over small{color:var(--bad);}
.o-grade{right:12px;top:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;border:1px solid;}
.gA{background:rgba(63,185,80,.9);color:#04140a;border-color:rgba(63,185,80,.95);}
.gB{background:rgba(88,166,255,.9);color:#041020;border-color:rgba(88,166,255,.95);}
.gC{background:rgba(210,153,34,.92);color:#150e01;border-color:rgba(210,153,34,.95);}
.gD{background:rgba(248,81,73,.9);color:#1a0505;border-color:rgba(248,81,73,.95);}
.gN{background:rgba(110,118,129,.85);color:#0d1117;border-color:rgba(110,118,129,.9);}
.o-av{left:12px;top:12px;padding:4px 10px;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;}
.avok{background:rgba(63,185,80,.92);color:#04140a;}
.avno{background:rgba(248,81,73,.92);color:#1a0505;}
.avmid{background:rgba(210,153,34,.92);color:#150e01;}
.avunk{background:rgba(10,13,18,.8);color:var(--muted);border:1px solid var(--line);}

/* swipe stamps */
.stamp{position:absolute;top:26px;padding:6px 16px;border:3px solid;border-radius:10px;
  font-size:1.15rem;font-weight:900;letter-spacing:1px;opacity:0;transform:rotate(-14deg);}
.st-yes{left:20px;color:var(--like);border-color:var(--like);transform:rotate(-14deg);}
.st-no{right:20px;color:var(--nope);border-color:var(--nope);transform:rotate(14deg);}

/* body */
.bd{padding:13px 15px 14px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;overflow:hidden;}
.nm{font-size:1.08rem;font-weight:800;letter-spacing:-.3px;line-height:1.25;}
.nm a{color:var(--text);}
.mt{font-size:.7rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;}

.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;
  font-size:.66rem;font-weight:800;border:1px solid;}
.pill b{font-weight:800;}
.pYes{background:rgba(63,185,80,.15);color:var(--ok);border-color:rgba(63,185,80,.34);}
.pNo{background:rgba(248,81,73,.15);color:var(--bad);border-color:rgba(248,81,73,.34);}
.pMid{background:rgba(210,153,34,.15);color:var(--warn);border-color:rgba(210,153,34,.34);}
.pUnk{background:rgba(110,118,129,.12);color:var(--muted);border-color:var(--line);}

.vd{border-radius:9px;padding:8px 11px;font-size:.71rem;line-height:1.5;border:1px solid;}
.vdPass{background:rgba(63,185,80,.13);border-color:rgba(63,185,80,.32);color:#8fe09f;}
.vdGap{background:rgba(210,153,34,.13);border-color:rgba(210,153,34,.3);color:#e3c07a;}
.vdHard{background:rgba(248,81,73,.13);border-color:rgba(248,81,73,.32);color:#f0a19c;}
.vd b{font-weight:800;}

.specs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:.69rem;}
.sp{display:flex;justify-content:space-between;gap:8px;}
.sp .k{color:var(--muted);}
.sp .v{font-weight:700;text-align:right;}
.sp .v.dim{color:var(--muted);font-weight:500;}

.links{display:flex;gap:7px;margin-top:auto;padding-top:8px;}
.lbtn{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:.73rem;font-weight:800;
  text-decoration:none;cursor:pointer;border:1px solid;transition:all .13s;}
.lbtn.open{background:rgba(88,166,255,.15);color:var(--accent);border-color:rgba(88,166,255,.34);}
.lbtn.open:hover{background:var(--accent);color:#08111f;}
.lbtn.more{background:transparent;border-color:var(--line);color:var(--muted);flex:0 0 auto;padding:8px 13px;}
.lbtn.more:hover{color:var(--text);border-color:var(--accent);}

/* ---------- ACTION BAR ---------- */
.acts{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px 0 16px;flex-shrink:0;}
.abtn{
  border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-weight:800;transition:transform .12s, box-shadow .12s; background:var(--elev);
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.abtn:active{transform:scale(.9);}
.a-no{width:58px;height:58px;font-size:1.5rem;color:var(--nope);border:2px solid rgba(248,81,73,.5);}
.a-no:hover{background:rgba(248,81,73,.16);box-shadow:0 6px 20px rgba(248,81,73,.3);}
.a-yes{width:58px;height:58px;font-size:1.5rem;color:var(--like);border:2px solid rgba(63,185,80,.5);}
.a-yes:hover{background:rgba(63,185,80,.16);box-shadow:0 6px 20px rgba(63,185,80,.3);}
.a-info{width:44px;height:44px;font-size:1.05rem;color:var(--muted);border:2px solid var(--line);}
.a-info:hover{color:var(--text);border-color:var(--accent);}

/* ---------- END / EMPTY ---------- */
.end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:30px;color:var(--muted);}
.end.on{display:flex;}
.end .big{font-size:2.6rem;}
.end h2{margin:0;color:var(--text);font-size:1.15rem;}
.end p{margin:0;font-size:.78rem;line-height:1.6;max-width:300px;}
.end .btn{background:var(--accent);color:#08111f;border:none;padding:9px 20px;border-radius:9px;
  font-weight:800;font-size:.8rem;cursor:pointer;margin-top:4px;}

/* ---------- SHEET ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--elev);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:18px 18px 26px;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:60;max-height:82vh;overflow-y:auto;}
.sheet.on{transform:translateY(0);}
.sh-handle{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
.sh-title{font-size:1.02rem;font-weight:800;margin-bottom:3px;}
.sh-sub{font-size:.7rem;color:var(--muted);margin-bottom:12px;}
.sh-sec{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
  font-weight:800;margin:14px 0 6px;}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.73rem;}
.sh-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
  border-bottom:1px solid rgba(38,45,56,.6);}
.sh-row .k{color:var(--muted);}
.sh-row .v{font-weight:700;text-align:right;}
.sh-src{font-size:.68rem;color:var(--muted);line-height:1.6;background:var(--card);
  padding:9px 11px;border-radius:9px;border:1px solid var(--line);margin-top:6px;}
.sh-close{position:absolute;right:14px;top:14px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.95rem;}
.sh-close:hover{color:var(--text);border-color:var(--accent);}

/* lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(3,5,8,.96);z-index:80;
  align-items:center;justify-content:center;cursor:zoom-out;}
.lb.on{display:flex;}
.lb img{max-width:94%;max-height:90%;border-radius:10px;}

@media(max-width:430px){
  .deck{max-width:100%;}
  .ph{height:48%;}
}
</style>
</head>

</div>

<div class="sheet" id="sheet"></div>

/* ==================== STATE ==================== */
var queue = [], seen = {}, FILTER = 'all';

try{ likes = JSON.parse(localStorage.getItem(VKEY) || '{}'); }catch(e){ likes = {}; }

/* ==================== HELPERS ==================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pnum(p){var m=String(p).match(/([\d,]+)/);return m?parseInt(m[1].replace(/,/g,''),10):999999;}
function grade(n){
  if(n==null) return {g:'?',c:'gN',t:'Not measured'};
  if(n<=20)  return {g:'A',c:'gA',t:n+' calls / 0.25mi / 90d'};
  if(n<=50)  return {g:'B',c:'gB',t:n+' calls / 0.25mi / 90d'};
  if(n<=120) return {g:'C',c:'gC',t:n+' calls / 0.25mi / 90d'};
  return {g:'D',c:'gD',t:n+' calls / 0.25mi / 90d'};
}
function wdS(o){
  if(o.wd==='inunit')  return ['In-unit W/D','pYes','Washer and dryer inside the unit'];
  if(o.wd==='onsite')  return ['On-site laundry','pMid','Shared laundry room in the building'];
  if(o.wd==='shared')  return ['Shared laundry','pNo','Laundry is shared, not in the unit'];
  return ['W/D ?','pUnk','Could not verify from any public page'];
}
function pkS(o){
  if(o.park==='garage')    return ['Garage','pYes','Garage included'];
  if(o.park==='offstreet') return ['Off-street','pYes','Off-street parking'];
  if(o.park==='parking')   return ['Parking','pMid','Some parking, type unclear'];
  return ['Parking ?','pUnk','Could not verify'];
}
function dwS(o){
  return o.dw==='yes' ? ['Dishwasher','pYes','Dishwasher in unit'] : ['Dishwasher ?','pUnk','Could not verify'];
}
function avS(o){
  var a=(o.avail||'').toLowerCase();
  if(a.indexOf('unavailable')>=0||a.indexOf('not listed')>=0) return ['Unavailable','avno'];
  if(a.indexOf('available now')>=0||a.indexOf('listed')>=0)   return ['Available','avok'];
  if(a.indexOf('cannot verify')>=0) return ['Unverified','avunk'];
  return [o.avail||'Unknown','avunk'];
}
function core(o){ return o.wd==='inunit' && (o.park==='garage'||o.park==='offstreet'); }
function inB(p){ return pnum(p)<=800; }

function verdict(o){
  var f=[],hard=false;
  if(pnum(o.price)>800) f.push('$'+pnum(o.price)+' over the $800 ceiling');
  if(o.beds!=null&&o.beds<2){f.push('only '+o.beds+'BR');hard=true;}
  if(o.zip==='57104'){f.push('zip 57104 excluded');hard=true;}
  if(o.wd!=='inunit'){
    if(o.wd==='onsite'){f.push('no in-unit W/D (on-site only)');hard=true;}
    else if(o.wd==='shared'){f.push('no in-unit W/D (shared)');hard=true;}
    else f.push('W/D unverified');
  }
  if(o.park==='unknown') f.push('parking unverified');
  else if(o.park==='parking') f.push('parking type unclear');
  var g=grade(o.sfpd);
  if(o.sfpd!=null&&(g.g==='C'||g.g==='D')) f.push('SFPD '+g.g+' ('+o.sfpd+')');
  if(avS(o)[1]==='avno'){f.push('no longer available');hard=true;}
  if(!f.length) return '<div class="vd vdPass"><b>Meets every target.</b></div>';
  return '<div class="vd '+(hard?'vdHard':'vdGap')+'"><b>'+(hard?'Blocked: ':'Gaps: ')+
         f.map(esc).join(' &bull; ')+'.</div>';
}

/* ==================== FILTERS ==================== */
var FILTERS=[
  {k:'all',   l:'All'},
  {k:'core',  l:'Meets core'},
  {k:'avail', l:'Available'},
  {k:'safe',  l:'Safe A/B'},
  {k:'budget',l:'In budget'}
];
function pass(o){
  var g=grade(o.sfpd).g;
  if(FILTER==='core')   return core(o);
  if(FILTER==='avail')  return avS(o)[1]==='avok';
  if(FILTER==='safe')   return g==='A'||g==='B';
  if(FILTER==='budget') return inB(o.price);
  return true;
}
function buildFilters(){
  document.getElementById('filters').innerHTML = FILTERS.map(function(f){
    var n = L.filter(function(o){return pass.call(null,o) || f.k==='all';}).length;
    var cnt = f.k==='all' ? L.length : L.filter(pass).length;
    return '<div class="fchip'+(f.k===FILTER?' on':'')+'" data-k="'+f.k+'">'+f.l+'</div>';
  }).join('');
  document.querySelectorAll('.fchip').forEach(function(c){
    c.addEventListener('click',function(){
      FILTER=c.dataset.k;
      document.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on');
      resetDeck();
    });
  });
}

/* ==================== DECK ==================== */
function cardEl(o){
  var g=grade(o.sfpd), av=avS(o), wd=wdS(o), pk=pkS(o), dw=dwS(o);
  var over=!inB(o.price);
  var specs='';
  if(o.beds!=null) specs+='<div class="sp"><span class="k">Layout</span><span class="v">'+o.beds+'BR / '+o.baths+'BA</span></div>';
  if(o.sqft)       specs+='<div class="sp"><span class="k">Size</span><span class="v">'+o.sqft+' sf</span></div>';
  if(o.zip)        specs+='<div class="sp"><span class="k">Zip</span><span class="v">'+esc(o.zip)+'</span></div>';
  if(o.deposit)    specs+='<div class="sp"><span class="k">Deposit</span><span class="v'+(/tbd|unknown/i.test(o.deposit)?' dim':'')+'">'+esc(o.deposit)+'</span></div>';
  if(o.lease)      specs+='<div class="sp"><span class="k">Lease</span><span class="v'+(/tbd|unknown/i.test(o.lease)?' dim':'')+'">'+esc(o.lease)+'</span></div>';

  var photo = o.photo
    ? '<img src="'+esc(o.photo)+'" alt="'+esc(o.name)+'" onclick="zoom(this.src)">'
    : '<div class="np">NO PHOTO ON LISTING</div>';

  var d=document.createElement('div');
  d.className='card';
  d.dataset.slug=o.slug;
  d.innerHTML=
    '<div class="ph"'+(o.photo?' onclick="zoom(this.querySelector(\'img\').src)"':'')+'>'+photo+
      '<div class="ov o-av '+av[1]+'">'+esc(av[0])+'</div>'+
      '<div class="ov o-grade '+g.c+'" title="'+esc(g.t)+'">'+g.g+'</div>'+
      '<div class="ov o-price'+(over?' over':'')+'">'+esc(o.price_raw)+
        '<small>'+(over?'OVER CEILING':'IN BUDGET')+'</small></div>'+
      '<div class="stamp st-yes">KEEP</div><div class="stamp st-no">PASS</div>'+
    '</div>'+
    '<div class="bd">'+
      '<div><div class="nm"><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.name)+'</a></div>'+
      '<div class="mt">'+esc(o.type||'')+(o.type?' &bull; ':'')+esc(o.manager||'')+
        (o.manager&&o.phone?' &bull; ':'')+esc(o.phone||'')+'</div></div>'+
      '<div class="pills">'+
        '<span class="pill '+wd[1]+'" title="'+esc(wd[2])+'">'+esc(wd[0])+'</span>'+
        '<span class="pill '+pk[1]+'" title="'+esc(pk[2])+'">'+esc(pk[0])+'</span>'+
        '<span class="pill '+dw[1]+'" title="'+esc(dw[2])+'">'+esc(dw[0])+'</span>'+
      '</div>'+
      verdict(o)+
      '<div class="specs">'+specs+'</div>'+
      '<div class="links">'+
        '<a class="lbtn open" href="'+esc(o.url)+'" target="_blank" rel="noopener">Open listing &#8599;</a>'+
        '<button class="lbtn more" onclick="sheet(\''+esc(o.slug)+'\')">Details</button>'+
      '</div>'+
    '</div>';
  attachDrag(d,o);
  return d;
}

function render(){
  var deck=document.getElementById('deck');
  deck.innerHTML='';
  document.getElementById('end').classList.remove('on');
  var list=L.filter(pass);
  if(!list.length){
    document.getElementById('end').classList.add('on');
    document.getElementById('endP').textContent='Nothing matches this filter.';
    updCount(0,0);
    return;
  }
  queue=list.slice();
  // stack up to 3 visible
  for(var i=Math.min(queue.length,3)-1;i>=0;i--){
    var el=cardEl(queue[i]);
    el.style.zIndex=10-i;
    el.style.transform='translateY('+(i*7)+'px) scale('+(1-i*0.035)+')';
    el.style.opacity = i===0?'1':String(1-i*0.25);
    deck.appendChild(el);
  }
  updCount(queue.length,list.length);
}
function updCount(rem,tot){
  document.getElementById('count').textContent = rem+' left'+(tot!==rem?' of '+tot:'');
}

/* ==================== SWIPE ==================== */
function topCard(){ return document.querySelector('#deck .card:not(.gone)'); }

function fly(dir){
  var c=topCard();
  if(!c||c.classList.contains('flying')) return;
  c.classList.add('flying');
  var slug=c.dataset.slug;
  var o=queue.filter(function(x){return x.slug===slug;})[0];
  if(dir==='yes'&&o){ likes[slug]=1; }
  else { delete likes[slug]; }
  try{localStorage.setItem(VKEY,JSON.stringify(likes));}catch(e){}
  c.style.transform='translateX('+(dir==='yes'?1:-1)*560+'px) rotate('+(dir==='yes'?22:-22)+'deg)';
  c.classList.add('gone');
  setTimeout(function(){
    c.remove();
    // promote next
    var rest=Array.prototype.slice.call(document.querySelectorAll('#deck .card'));
    rest.forEach(function(el,i){
      el.style.zIndex=10-i;
      el.style.transform='translateY('+(i*7)+'px) scale('+(1-i*0.035)+')';
      el.style.opacity = i===0?'1':String(1-i*0.25);
    });
    // add a new bottom card if available
    var remaining=queue.length - document.querySelectorAll('#deck .card').length;
    if(remaining>0){
      var next=queue[queue.length-remaining];
      var el=cardEl(next);
      el.style.zIndex=7;
      el.style.transform='translateY(14px) scale(.93)';
      el.style.opacity='.5';
      document.getElementById('deck').appendChild(el);
    }
    var left=document.querySelectorAll('#deck .card:not(.gone)').length;
    updCount(left, L.filter(pass).length);
    if(left===0){
      document.getElementById('end').classList.add('on');
      var n=Object.keys(likes).length;
      document.getElementById('endP').textContent = n
        ? 'You kept '+n+'. Nothing else matches this filter.'
        : 'Nothing matched this filter.';
    }
  },320);
}

function attachDrag(el,o){
  var sx=0,sy=0,dx=0,dy=0,drag=false;
  var yes=el.querySelector('.st-yes'), no=el.querySelector('.st-no');
  function down(e){
    if(el!==topCard())return;
    if(e.target.closest('a,button'))return;
    drag=true; el.classList.add('dragging');
    var p=e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY;
  }
  function move(e){
    if(!drag)return;
    var p=e.touches?e.touches[0]:e;
    dx=p.clientX-sx; dy=p.clientY-sy;
    el.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx*0.05)+'deg)';
    if(yes)yes.style.opacity=Math.max(0,Math.min(1,dx/90));
    if(no)no.style.opacity=Math.max(0,Math.min(1,-dx/90));
    if(e.cancelable)e.preventDefault();
  }
  function up(){
    if(!drag)return;
    drag=false; el.classList.remove('dragging');
    if(dx>110) fly('yes');
    else if(dx<-110) fly('no');
    else{
      el.style.transform='translateY(0) scale(1)';
      if(yes)yes.style.opacity=0;
      if(no)no.style.opacity=0;
    }
    dx=0;dy=0;
  }
  el.addEventListener('mousedown',down);
  el.addEventListener('touchstart',down,{passive:true});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}

/* ==================== SHEET ==================== */
function sheet(slug){
  var o=L.filter(function(x){return x.slug===slug;})[0];
  if(!o)return;
  var g=grade(o.sfpd);
  var rows='';
  function r(k,v,dim){ return '<div class="sh-row"><span class="k">'+k+'</span><span class="v'+(dim?' dim':'')+'">'+esc(v)+'</span></div>'; }
  rows+=r('Type',o.type||'?');
  rows+=r('Manager',o.manager||'?');
  if(o.phone)rows+=r('Phone',o.phone);
  if(o.address)rows+=r('Address',o.address);
  if(o.beds!=null)rows+=r('Layout',o.beds+'BR / '+o.baths+'BA');
  if(o.sqft)rows+=r('Size',o.sqft+' sf');
  rows+=r('Zip',o.zip||'?');
  rows+=r('Rent',o.price_raw);
  if(o.deposit)rows+=r('Deposit',o.deposit,/tbd|unknown/i.test(o.deposit));
  if(o.lease)rows+=r('Lease',o.lease,/tbd|unknown/i.test(o.lease));
  if(o.utils)rows+=r('Utilities incl.',o.utils);
  if(o.phone)rows+=r('Phone',o.phone);
  rows+=r('Availability',o.avail||'?');
  rows+=r('Safety grade',g.g+' ('+(o.sfpd==null?'not measured':o.sfpd+' calls')+')');

  var amen='';
  if(o.amenities&&o.amenities.length){
    amen='<div class="pills">'+o.amenities.map(function(a){
      return '<span class="pill pUnk">'+esc(a)+'</span>';}).join('')+'</div>';
  }
  var src=o.amenity_source
    ? '<div class="sh-sec">Amenity source</div><div class="sh-src">'+esc(o.amenity_source)+'</div>' : '';

  document.getElementById('sheet').innerHTML=
    '<button class="sh-close" onclick="closeSheet()">&times;</button>'+
    '<div class="sh-handle"></div>'+
    '<div class="sh-title">'+esc(o.name)+'</div>'+
    '<div class="sh-sub">'+esc(o.price_raw)+' &bull; '+(o.sfpd==null?'safety unmeasured':'SFPD '+g.g+' &bull; '+o.sfpd+' calls')+'</div>'+
    '<div class="sh-sec">Amenities</div>'+amen+
    '<div class="sh-sec">Details</div><div class="sh-grid">'+rows+'</div>'+
    src+
    '<div class="sh-sec">Link</div><a class="lbtn open" style="display:block;margin-top:4px" href="'+esc(o.url)+'" target="_blank" rel="noopener">Open listing page &#8599;</a>';
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function zoom(src){ document.getElementById('lbImg').src=src; document.getElementById('lb').classList.add('on'); }
function resetDeck(){ seen={}; render(); }

/* ==================== INIT ==================== */
buildFilters();
render();
document.getElementById('bYes').addEventListener('click',function(){fly('yes');});
document.getElementById('bNo').addEventListener('click',function(){fly('no');});
document.getElementById('bInfo').addEventListener('click',function(){
  var c=topCard(); if(c) sheet(c.dataset.slug);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')fly('yes');
  if(e.key==='ArrowLeft')fly('no');
  if(e.key==='Escape'){closeSheet();document.getElementById('lb').classList.remove('on');}
});
</script>
